# Configuration Prometheus (extrait) pour les deux variantes SIS.
#
# À fusionner dans le `scrape_configs` du fichier `prometheus.yml` principal
# de l'environnement de déploiement (ce fichier n'est pas exécutable seul :
# c'est un fragment illustratif documentant les jobs attendus).
#
# Chaque variante expose ses métriques métier (utilisateurs, mappings EDX,
# événements outbox, etc.) sur `/metrics/` via `prometheus_client`
# (voir sis_secondaire/apps/core/healthcheck.py et
# sis_superieur/apps/core/healthcheck.py). Une cible est nécessaire par tenant :
# le Host HTTP sélectionne l'établissement. Les noms ci-dessous doivent résoudre
# vers un proxy de supervision PRIVÉ fixant le Host de l'API (voir MONITORING.md).
# Ne pas pointer ces cibles vers le proxy public, qui bloque /metrics/.

scrape_configs:
  - job_name: sis-secondaire
    metrics_path: /metrics/
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - supervision-secondaire.ecole.internal:8000
        labels:
          sis_variant: secondaire

  - job_name: sis-superieur
    metrics_path: /metrics/
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - supervision-superieur.ecole.internal:8000
        labels:
          sis_variant: superieur

rule_files:
  - alerts.yml
