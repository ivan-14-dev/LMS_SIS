# Generated by sis_local_urls. Keep operator resource limits in docker-compose.override.yml.
{% set local = sis_local_urls(
    SIS_LOCAL_URLS_ENABLED, SIS_LOCAL_URLS_PORT, ENABLE_HTTPS,
    ENABLE_WEB_PROXY, CADDY_HTTP_PORT, LMS_HOST, CMS_HOST, MFE_HOST | default(""),
    MEILISEARCH_HOST) %}
{% if local %}
services:
  caddy:
    ports: !override
      - "127.0.0.1:{{ SIS_LOCAL_URLS_PORT }}:{{ SIS_LOCAL_URLS_PORT }}"
    environment:
      default_site_port: ""
    networks:
      default:
        aliases: !override
          {% for host in local.values() %}
          - "{{ host }}"
          {% endfor %}
  smtp:
    environment:
      HOSTNAME: "{{ local.lms }}"
{% else %}
services: {}
{% endif %}
