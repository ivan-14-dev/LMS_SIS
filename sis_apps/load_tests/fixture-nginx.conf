worker_processes 1;
pid /runtime/nginx.pid;
error_log /runtime/logs/error.log warn;

events {
    worker_connections 2048;
}

http {
    server_tokens off;
    client_body_temp_path /runtime/client_body;
    proxy_temp_path /runtime/proxy;
    fastcgi_temp_path /runtime/fastcgi;
    uwsgi_temp_path /runtime/uwsgi;
    scgi_temp_path /runtime/scgi;
    log_format qualification escape=json
        '{"at":"$time_iso8601","msec":$msec,"status":$status,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"request_id":"$request_id","connection":$connection,'
        '"connection_requests":$connection_requests,"tls_reused":"$ssl_session_reused",'
        '"method":"$request_method","uri":"$uri","remote_addr":"$remote_addr"}';
    access_log /runtime/logs/access.jsonl qualification;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    client_max_body_size 2m;

    upstream sis {
        server sis-load-d0c25c75-api:8000;
    }

    server {
        listen 8443 ssl backlog=1024;
        server_name load-secondaire.localhost;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:4m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-SIS-Load-Request-ID $request_id always;

        if ($http_host != "load-secondaire.localhost:60031") {
            return 421;
        }

        location / {
            proxy_pass http://sis;
            proxy_http_version 1.1;
            # Do not reuse sockets that Gunicorn may close at its idle deadline.
            proxy_set_header Connection "close";
            proxy_set_header Host "load-secondaire.localhost:60031";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port 60031;
            proxy_set_header Forwarded "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
