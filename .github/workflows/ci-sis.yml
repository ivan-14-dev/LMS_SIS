name: CI - SIS Apps

on:
  push:
    branches: [main, develop]
    paths: ['sis_apps/**', '.github/workflows/ci-sis.yml']
  pull_request:
    paths: ['sis_apps/**', '.github/workflows/ci-sis.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  quality:
    name: Changed SIS code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sis_apps/frontend-app-sis/package-lock.json
      - run: pip install black isort flake8
      - run: npm ci --legacy-peer-deps --no-audit
        working-directory: sis_apps/frontend-app-sis
      - name: Blocking checks on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          python sis_apps/scripts/check_quality.py --base "$BASE_SHA"

  backend:
    name: Backend (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [secondaire, superieur]
    services:
      postgres:
        image: postgres:16.13-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_sis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test_sis"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the locked runtime
        run: docker build -t lms-sis:institution-pilot sis_apps
      - name: Backend and shared tests
        run: |
          docker run --rm --network host \
            -e SIS_VARIANT=${{ matrix.variant }} \
            -e DB_HOST=127.0.0.1 -e DB_USER=test -e DB_PASSWORD=test \
            -e DJANGO_DEBUG=True -e REDIS_URL=redis://127.0.0.1:6379/1 \
            lms-sis:institution-pilot \
            python -m pytest --confcutdir=/app -p no:cacheprovider apps ../sis_common/tests -q

  frontend:
    name: Frontend tests, build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sis_apps/frontend-app-sis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sis_apps/frontend-app-sis/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit
      - run: npm test -- --runInBand
      - run: npm run build
      # Remaining noncritical upstream advisories are documented in the installation guide.
      - run: npm audit --omit=dev --audit-level=critical

  dependencies:
    name: Locked Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit --disable-pip --no-deps -r sis_apps/requirements.lock

  installation:
    name: Clean installation (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [secondaire, superieur, dual]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sis_apps/frontend-app-sis/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit
        working-directory: sis_apps/frontend-app-sis
      - run: npx playwright install --with-deps chromium
        working-directory: sis_apps/frontend-app-sis
      - name: Bootstrap, browser journeys and persistent restart
        run: |
          python sis_apps/scripts/verify_installation.py \
            --mode "${{ matrix.mode }}" --work-dir "$RUNNER_TEMP/sis-installation" --verify-backup

  build-status:
    name: SIS build status
    runs-on: ubuntu-latest
    needs: [quality, backend, frontend, dependencies, installation]
    if: always()
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Failed SIS gates: " + ", ".join(failed))
          print("All SIS gates passed.")
          PY
